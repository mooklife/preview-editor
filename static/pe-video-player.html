<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>video</title>
  <style>
    html, body { margin: 0; padding: 0; background: #111; height: 100%; }
    video { display: block; width: 100%; height: 100%; max-height: 100vh; background: #111; }
  </style>
</head>
<body>
  <video id="v" controls playsinline preload="metadata"></video>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var src = q.get("src") || "";
      var title = q.get("title") || "";
      var v = document.getElementById("v");
      if (title) v.setAttribute("title", title);
      if (src) v.src = src;
    })();
  </script>
</body>
</html>
